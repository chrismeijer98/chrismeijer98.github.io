<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal — House of Pilots</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav no-print">
  <div class="nav-brand">
    <a href="index.html" class="btn-ghost" style="padding:6px;display:flex;align-items:center" title="Terug naar home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="nav-logo">
      <img src="assets/logo-mark.png" alt="House of Pilots">
    </div>
    <div>
      <div class="nav-title">House of Pilots Portal</div>
      <div class="nav-sub" id="nav-user">Pilot Career Plan</div>
    </div>
  </div>
  <div class="nav-right">
    <span class="role-btn active" id="role-badge"></span>
    <button class="role-btn" id="btn-logout" title="Uitloggen" style="background:transparent">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</nav>

<div class="app-grid">
  <aside class="sidebar no-print">
    <div class="sidebar-label">Navigatie</div>
    <button class="side-link" data-tab="dashboard">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      Dashboard
    </button>
    <button class="side-link" data-tab="agenda">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Agenda
    </button>
    <button class="side-link" data-tab="lab">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8L4.3 10.7l5.8 1.9L12 18.5l1.9-5.9 5.8-1.9-5.8-1.9z"/></svg>
      Lab
    </button>
    <button class="side-link" data-tab="ontwikkeling">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      Ontwikkeling
    </button>
    <button class="side-link" data-tab="oefenmateriaal">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Oefeningen
    </button>
    <button class="side-link" data-tab="praktisch">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Praktische zaken
    </button>

    <div style="margin-top:32px;padding:0 12px">
      <div class="sidebar-label" style="padding:0 0 10px">Huidige rol</div>
      <div id="role-card" style="padding:14px;border-radius:10px;border:1px solid"></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<footer class="hop-footer no-print">
  <div class="hop-footer-art"><img src="assets/plane-takeoff.svg" alt="" aria-hidden="true"></div>
  <img class="hop-footer-logo" src="assets/logo-full.png" alt="House of Pilots">
  <div class="hop-footer-copy">&copy; House of Pilots</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/oefendata.js"></script>
<script src="js/assessmentdata.js"></script>
<script src="js/utils.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
